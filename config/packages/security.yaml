security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        merchant_provider:
            entity:
                class: App\Merchant\Domain\Entity\Merchant
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        health:
            pattern: ^/health$
            security: false
        auth:
            pattern: ^/api/v1/auth(/|$)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: merchant_provider
            entry_point: App\Shared\Http\ApiAuthenticationEntryPoint
            access_denied_handler: App\Shared\Http\ApiAccessDeniedHandler
            user_checker: App\Merchant\Infrastructure\Security\MerchantUserChecker
            jwt: ~
            custom_authenticators:
                - App\Merchant\Infrastructure\Security\ApiKeyAuthenticator

    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
